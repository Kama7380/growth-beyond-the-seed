<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>When Your Best Employees Go Quiet | Growth Beyond the Seed</title><style>
:root{--green:#173b2b;--green2:#285a3c;--gold:#bd9651;--cream:#faf7ee;--ink:#20332b;--muted:#5b6a61}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}header{background:var(--green);color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-family:Georgia,serif;font-size:19px}.brand small{display:block;font:10px system-ui;letter-spacing:2px;color:#e5c78c}.pill{font-size:12px;background:#ffffff20;padding:6px 10px;border-radius:30px}main{max-width:850px;margin:28px auto 90px;padding:0 16px}.progress{height:8px;background:#e5e7dc;border-radius:20px;overflow:hidden;margin:12px 0 24px}.progress div{height:100%;background:var(--gold);transition:width .25s}.card{background:white;border:1px solid #e7e7db;border-radius:20px;padding:clamp(20px,4vw,38px);box-shadow:0 10px 35px #183b2710}.eyebrow{color:var(--green2);text-transform:uppercase;font-size:12px;letter-spacing:2px;font-weight:800}h1,h2{font-family:Georgia,serif;line-height:1.14;color:var(--green)}h1{font-size:clamp(31px,6vw,48px)}h2{font-size:clamp(27px,5vw,36px)}p{margin:12px 0 18px}.lead{font-size:19px;color:var(--muted)}.hero{padding:20px 0}.sprout{font-size:45px}.box{background:#f3f6ef;border-left:4px solid var(--gold);padding:18px;border-radius:8px;margin:20px 0}.choice{display:block;text-align:left;width:100%;padding:17px;margin:10px 0;border:1.5px solid #d7ded4;border-radius:12px;background:white;color:var(--ink);font:inherit;cursor:pointer}.choice:hover,.choice:focus{border-color:var(--green2);outline:2px solid transparent}.choice.selected{background:#eaf1e8;border:2px solid var(--green2)}.feedback{background:#eef3e8;border-radius:12px;padding:18px;margin-top:18px}.buttons{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:25px}button.primary,button.secondary{border-radius:10px;padding:12px 18px;font:700 15px system-ui;cursor:pointer}.primary{background:var(--green);color:white;border:1px solid var(--green)}.secondary{background:white;color:var(--green);border:1px solid #aebcad}button:disabled{opacity:.4;cursor:not-allowed}textarea,input{width:100%;font:inherit;border:1px solid #b6c5b9;border-radius:9px;padding:12px;background:white}textarea{min-height:105px}label{font-weight:700;display:block;margin:15px 0 6px}.mini{font-size:13px;color:var(--muted)}.steps{display:flex;gap:6px;flex-wrap:wrap}.step{font-size:12px;padding:5px 9px;border-radius:20px;background:#e6ebdf}.step.active{background:var(--green);color:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f2f4ec;padding:14px;border-radius:12px}footer{text-align:center;color:#6b746c;font-size:12px;padding:20px}.hide{display:none}.result{font-size:21px;font-weight:800;color:var(--green)}@media(max-width:560px){.two{grid-template-columns:1fr}.card{padding:20px}header{align-items:flex-start}}@media print{header,.buttons,.progress,.steps,.noprint{display:none!important}body{background:white}.card{border:0;box-shadow:none}main{margin:0}}
</style></head><body><header><div class="brand">🌱 Growth Beyond the Seed<small>LEADERSHIP & DEVELOPMENT</small></div><span class="pill">Training Academy · Prototype</span></header><main><div class="steps" id="steps"></div><div class="progress" aria-label="Course progress"><div id="bar"></div></div><section class="card" id="screen" aria-live="polite"></section></main><footer>© 2026 Growth Beyond the Seed. Original training prototype for evaluation. Not legal or HR compliance advice.</footer><script>
const KEY='gbts_lesson1_v1';let state={page:0,answers:{},reflection:'',plan:{}};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};const total=8;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(key,items)=>items.map((it,i)=>`<button class="choice ${state.answers[key]===i?'selected':''}" onclick="choose('${key}',${i})">${String.fromCharCode(65+i)}. ${it}</button>`).join('');function choose(k,i){state.answers[k]=i;save();render()}function move(n){state.page=Math.max(0,Math.min(total-1,n));save();render();scrollTo({top:0,behavior:'smooth'})}function setText(k,v){state[k]=v;save()}function plan(k,v){state.plan[k]=v;save()}function reset(){if(confirm('Restart this lesson and clear your answers?')){state={page:0,answers:{},reflection:'',plan:{}};save();render()}}function nav(prev=true,next=true,nextLabel='Continue'){return `<div class="buttons"><button class="secondary" onclick="move(${state.page-1})" ${!prev?'disabled':''}>← Back</button><button class="primary" onclick="move(${state.page+1})" ${!next?'disabled':''}>${nextLabel} →</button></div>`}function feedback(text){return `<div class="feedback"><strong>Let's look closer</strong><p>${text}</p></div>`}
const pages=[
()=>`<div class="hero"><div class="sprout">🌱</div><p class="eyebrow">The Workplace Worth Belonging To Series · Lesson 1</p><h1>When Your Best Employees Go Quiet</h1><p class="lead">Recognizing changes in engagement before valuable employees leave.</p></div><div class="box"><strong>Your mission</strong><p>Step into a real-world leadership situation. You'll make decisions, see multiple perspectives, and leave with a practical conversation plan. There isn't always one perfect answer.</p></div><div class="two"><div class="stat"><strong>10–15 minutes</strong><div class="mini">Prototype experience</div></div><div class="stat"><strong>5-step method</strong><div class="mini">Notice · Understand · Connect · Cultivate · Grow</div></div></div>${nav(false,true,'Begin lesson')}`,
()=>`<p class="eyebrow">Step 1 · Notice</p><h2>Meet Jordan</h2><p>Jordan has worked at a growing service business for four years. Customers trust Jordan, deadlines are consistently met, and Jordan used to contribute ideas in team meetings.</p><p>Over the last three months, Jordan has stopped offering suggestions. The work still gets done, but the enthusiasm seems different.</p><div class="box"><strong>Important:</strong> Quiet behavior is not proof that someone is disengaged. There could be many reasons for the change, including personal circumstances, meeting dynamics, workload, or simply a preference for speaking less.</div><p><strong>What is the most useful first observation?</strong></p>${opts('observe',['Jordan is probably looking for another job.','Jordan’s participation has changed, while performance remains strong.','Jordan needs more challenging work.'])}${state.answers.observe!==undefined?feedback(['This is a possible explanation, but it goes beyond the evidence. Notice behavior before assigning a motive.','Exactly. Describe the observable change without diagnosing its cause.','More challenge could help some people, but you do not yet know what Jordan needs.'][state.answers.observe]):''}${nav(true,state.answers.observe!==undefined)}`,
()=>`<p class="eyebrow">Step 2 · Understand</p><h2>What you haven't seen</h2><p>Now switch perspectives. Jordan has spent months training new hires and covering gaps. Two improvement suggestions received no response. Jordan is proud of the work but wonders whether there is room to grow.</p><div class="box"><strong>Jordan's private thought:</strong> “I still care about doing a good job. I'm just tired of feeling like the extra effort is invisible.”</div><p><strong>Which lesson matters most?</strong></p>${opts('understand',['Strong performance can coexist with frustration or exhaustion.','If Jordan wants growth, the manager should promise a promotion.','Jordan should have complained more directly.'])}${state.answers.understand!==undefined?feedback(['Yes. Leaders cannot rely on performance alone to measure someone's experience.','A promise the manager cannot deliver may damage trust further. Start by listening and exploring realistic options.','Employees have a role in communicating needs, but leaders can create safer opportunities for that conversation.'][state.answers.understand]):''}${nav(true,state.answers.understand!==undefined)}`,
()=>`<p class="eyebrow">Step 3 · Connect</p><h2>Your first move</h2><p>You are Jordan's manager. You have noticed the change, but you don't know what it means. What do you do?</p>${opts('connect',['Praise Jordan in the next team meeting and assume that solves it.','Invite Jordan to a private check-in, share what you noticed, and ask open questions.','Give Jordan a major new assignment to rebuild enthusiasm.'])}${state.answers.connect!==undefined?feedback(['Recognition may be welcome, but it does not replace understanding Jordan’s experience.','A thoughtful check-in is the strongest starting point. Avoid assumptions, give Jordan room to speak, and respect what they choose not to share.','More work could make an already heavy workload worse. Learn what is happening before prescribing a solution.'][state.answers.connect]):''}${nav(true,state.answers.connect!==undefined)}`,
()=>`<p class="eyebrow">Step 3 · Connect, continued</p><h2>Choose your opening words</h2><p>Jordan joins your one-on-one. Which opening would you use?</p>${opts('words',['“You’ve been quiet lately. Are you planning to quit?”','“I’ve noticed you haven’t shared as many ideas in meetings lately. How are things going from your perspective?”','“We need you to bring more energy to the team.”'])}${state.answers.words!==undefined?feedback(['This assumes a motive and may make Jordan defensive.','This names an observable change and invites Jordan’s perspective without forcing a conclusion.','This focuses on appearance rather than understanding what changed.'][state.answers.words]):''}<label for="reflection">Try it in your own voice. What would you say?</label><textarea id="reflection" placeholder="Write your own respectful opening question..." oninput="setText('reflection',this.value)">${esc(state.reflection)}</textarea><p class="mini">Your writing stays in this browser on this device in this prototype.</p>${nav(true,state.answers.words!==undefined)}`,
()=>`<p class="eyebrow">Step 4 · Cultivate</p><h2>Listening is only the beginning</h2><p>Jordan tells you: “I like this team, but I've been carrying a lot lately. I suggested a few changes, and nothing happened. I'm not sure where I go from here.”</p><p>Which response builds the strongest foundation?</p>${opts('follow',['“I hear you. Let’s review your workload, revisit those suggestions, and agree on what I can follow up on by next Friday.”','“Everyone is busy. Try to stay positive.”','“I promise we’ll get you promoted soon.”'])}${state.answers.follow!==undefined?feedback(['Strong choice. It acknowledges the concern, avoids unsupported promises, and creates a specific next step.','This minimizes the concern and offers no meaningful action.','Avoid promises outside your authority. Honest options and follow-through build more trust.'][state.answers.follow]):''}${nav(true,state.answers.follow!==undefined)}`,
()=>`<p class="eyebrow">Step 5 · Grow</p><h2>Build your 30-day action plan</h2><p>Choose one real situation at work where you could improve how you notice, listen, and follow through. Avoid entering confidential employee information.</p><label for="s1">Within 7 days, I will notice or ask...</label><textarea id="s1" oninput="plan('notice',this.value)" placeholder="Example: Schedule a supportive check-in and ask about workload and goals.">${esc(state.plan.notice)}</textarea><label for="s2">Within 14 days, I will follow through by...</label><textarea id="s2" oninput="plan('follow',this.value)" placeholder="Example: Review a process suggestion and communicate what can change.">${esc(state.plan.follow)}</textarea><label for="s3">Within 30 days, I will measure progress by...</label><textarea id="s3" oninput="plan('measure',this.value)" placeholder="Example: Ask whether the change helped and document next steps.">${esc(state.plan.measure)}</textarea>${nav(true,true,'Review my plan')}`,
()=>`<p class="eyebrow">Lesson 1 complete</p><div class="sprout">🌿</div><h2>Better workplaces grow through follow-through.</h2><p>You practiced observing without assuming, exploring the employee's perspective, starting a respectful conversation, and turning feedback into action.</p><div class="box"><strong>Your 30-day action plan</strong><p><b>7 days:</b> ${esc(state.plan.notice)||'Not yet entered'}</p><p><b>14 days:</b> ${esc(state.plan.follow)||'Not yet entered'}</p><p><b>30 days:</b> ${esc(state.plan.measure)||'Not yet entered'}</p></div><p><strong>Your conversation opener:</strong> ${esc(state.reflection)||'Not yet entered'}</p><p class="result">Notice → Understand → Connect → Cultivate → Grow</p><div class="buttons"><button class="secondary" onclick="move(6)">← Edit action plan</button><button class="primary" onclick="window.print()">Print / Save as PDF</button></div><div class="buttons noprint"><button class="secondary" onclick="reset()">Restart lesson</button></div><p class="mini">This is a pilot lesson, not an accredited certification. More lessons in the series are planned.</p>`
];function render(){document.getElementById('screen').innerHTML=pages[state.page]();document.getElementById('bar').style.width=(state.page/(total-1)*100)+'%';document.getElementById('steps').innerHTML=['Welcome','Notice','Understand','Connect','Practice','Cultivate','Plan','Complete'].map((t,i)=>`<span class="step ${i===state.page?'active':''}">${i+1}. ${t}</span>`).join('')}render();
</script></body></html>
